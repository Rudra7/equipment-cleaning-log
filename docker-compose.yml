services:
  postgres:
    image: postgres:16-alpine
    container_name: equipment-cleaning-log-postgres
    environment:
      POSTGRES_DB: equipment_cleaning_log
      POSTGRES_USER: equipment_cleaning_log
      POSTGRES_PASSWORD: equipment_cleaning_log
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U equipment_cleaning_log -d equipment_cleaning_log"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
